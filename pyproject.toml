[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlora-analytics-agent"
version = "0.1.0"
description = "QLoRA fine-tuning of open LLMs for enterprise analytics-agent skill routing and safe SQL generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GlobalTrade Analytics Research" }]
keywords = ["qlora", "llm", "text-to-sql", "skill-routing", "analytics-agent", "peft"]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
    "faker>=25.0.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.9.6",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
]
snowflake = ["snowflake-connector-python[pandas]>=3.11.0"]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
